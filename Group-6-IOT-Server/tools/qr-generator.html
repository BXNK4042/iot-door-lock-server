<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายการห้องระบบ IoT Door Access (Group 6)</title>
  <link rel="icon" type="image/webp" href="/logo/ce_logo.webp">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', -apple-system, sans-serif;
    }
    body {
      background: #0b0f19;
      color: #f3f4f6;
      min-height: 100vh;
      padding: 30px 20px 60px 20px;
      background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 35px;
    }
    .logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 15px;
      color: #9ca3af;
    }
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .room-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 24px 20px;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    .room-card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 12px 30px rgba(99, 102, 241, 0.2);
    }
    .room-card.default-room {
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.05);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 10px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }
    .badge.main-badge {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.5);
    }
    .room-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
    }
    .qr-box {
      background: #ffffff;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-box img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .btn-open {
      display: inline-block;
      width: 100%;
      padding: 10px 16px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border-radius: 10px;
      transition: all 0.2s ease;
      margin-top: auto;
    }
    .btn-open:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    .nav-links {
      text-align: center;
      margin-top: 40px;
    }
    .nav-links a {
      color: #818cf8;
      text-decoration: none;
      font-size: 14px;
      margin: 0 12px;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="/logo/ce_logo.webp" alt="CE Logo" class="logo-img">
      <h1>ระบบ IoT Smart Door Access (Group 6)</h1>
      <p class="subtitle">สแกน QR Code หรือคลิกเพื่อเข้าสู่หน้าแต่ละห้อง</p>
    </div>

    <!-- กล่องตั้งค่า Host สำหรับ QR Code -->
    <div style="background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; padding: 16px 20px; margin-bottom: 25px; text-align: center; backdrop-filter: blur(10px);">
      <div style="font-size: 14px; color: #d1d5db; font-weight: 500;">
        📱 <strong>Host สำหรับสร้าง QR Code:</strong>
      </div>
      <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 10px 0;">
        <input type="text" id="hostInput" style="padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.4); color: #fff; width: 360px; max-width: 100%; font-size: 14px;" placeholder="http://172.16.13.191:3000">
        <button type="button" style="padding: 9px 20px; border-radius: 10px; border: none; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; font-weight: 600; cursor: pointer; font-size: 14px;" onclick="applyHost()">🔄 อัปเดต QR Code</button>
      </div>
      <div style="display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 6px;">
        <button type="button" style="padding: 5px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.06); color: #9ca3af; font-size: 12px; cursor: pointer;" onclick="setHost('http://172.16.13.191:3000')">📶 ใช้ IP Wi-Fi (172.16.13.191)</button>
        <button type="button" style="padding: 5px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.06); color: #9ca3af; font-size: 12px; cursor: pointer;" onclick="setHost('http://localhost:3000')">💻 ใช้ localhost</button>
      </div>
      <div id="localhostTip" style="font-size: 13px; color: #fbbf24; margin-top: 8px; display: none;">
        ⚠️ <strong>หมายเหตุ:</strong> หากใช้มือถือสแกน ค่า URL ต้องไม่ใช่ localhost (ให้กดปุ่ม <em>"ใช้ IP Wi-Fi"</em> ด้านบน หรือใช้ Cloudflare URL ครับ)
      </div>
    </div>

    <div class="rooms-grid" id="roomsGrid">
      <!-- Generated via JavaScript -->
    </div>

    <div class="nav-links">
      <a href="/?room=B316">🚪 หน้าหลักห้อง B316</a>
      <a href="/api/logs" target="_blank">📋 ดู API Logs สำหรับกลุ่มอื่น</a>
      <a href="/health" target="_blank">💚 Health Check</a>
    </div>
  </div>

  <script>
    const ROOMS = [
      { id: 'B316', label: 'ห้อง B316', isMain: true, building: 'อาคารเรียนรวม B' },
      { id: 'B317', label: 'ห้อง B317', isMain: false, building: 'อาคารเรียนรวม B' },
      { id: 'B217', label: 'ห้อง B217', isMain: false, building: 'อาคารเรียนรวม B' },
      { id: 'B218', label: 'ห้อง B218', isMain: false, building: 'อาคารเรียนรวม B' },
      { id: 'E111', label: 'ห้อง E111', isMain: false, building: 'อาคารภาควิชา E' },
      { id: 'E112', label: 'ห้อง E112', isMain: false, building: 'อาคารภาควิชา E' },
      { id: 'E113', label: 'ห้อง E113', isMain: false, building: 'อาคารภาควิชา E' },
      { id: 'E107', label: 'ห้อง E107', isMain: false, building: 'อาคารภาควิชา E' }
    ];

    const hostInput = document.getElementById('hostInput');
    const localhostTip = document.getElementById('localhostTip');
    const grid = document.getElementById('roomsGrid');

    // กำหนด Cloudflare Tunnel URL ล่าสุด หรือ URL ปัจจุบัน
    const CLOUDFLARE_URL = 'https://sunglasses-spider-glucose-serial.trycloudflare.com';
    let currentHost = window.location.origin.includes('localhost') ? CLOUDFLARE_URL : window.location.origin;
    if (hostInput) hostInput.value = currentHost;

    function renderCards() {
      grid.innerHTML = '';
      const base = (hostInput ? hostInput.value.trim() : '') || currentHost;
      const cleanBase = base.replace(/\/$/, '');

      if (cleanBase.includes('localhost') || cleanBase.includes('127.0.0.1')) {
        if (localhostTip) localhostTip.style.display = 'block';
      } else {
        if (localhostTip) localhostTip.style.display = 'none';
      }

      ROOMS.forEach(room => {
        const roomUrl = `${cleanBase}/?room=${room.id}`;
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(roomUrl)}`;

        const card = document.createElement('div');
        card.className = `room-card ${room.isMain ? 'default-room' : ''}`;
        card.innerHTML = `
          <span class="badge ${room.isMain ? 'main-badge' : ''}">${room.isMain ? '⭐ ห้องหลัก (Default)' : room.building}</span>
          <div class="room-title">${room.label}</div>
          <div class="qr-box">
            <img src="${qrApiUrl}" alt="QR Code ${room.id}" loading="lazy">
          </div>
          <div style="font-size: 11px; color: #9ca3af; margin-bottom: 12px; word-break: break-all; max-width: 200px;">
            ${roomUrl}
          </div>
          <a href="${roomUrl}" target="_blank" class="btn-open">เปิดหน้า ${room.id} ➔</a>
        `;
        grid.appendChild(card);
      });
    }

    function applyHost() {
      renderCards();
    }

    function setHost(url) {
      if (hostInput) hostInput.value = url;
      renderCards();
    }

    renderCards();
  </script>
</body>
</html>
